packages:
  - "docs"
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@tailwindcss/oxide": false
  core-js: false
  sharp: false
  unrs-resolver: false
  esbuild: true
  # Downloads the Sentry command line tool that uploads source maps (see @repo/observability).
  "@sentry/cli": true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
  - expo@57.0.27

overrides:
  # NativeWind 5 (apps/native) fails to read global.css with other lightningcss versions.
  # Starter-kit found the same. Keep it pinned until NativeWind 5 is stable.
  lightningcss: 1.30.1
